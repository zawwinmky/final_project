<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="CS50 final project, peer to peer encrypted messaging website with user sign up feature.">
        <meta name="author" content="Zaw Win">
        <!-- http://getbootstrap.com/docs/5.3/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

        <title>{% block title %} Final Project {% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <script src="{{ url_for('static', filename='main.js') }}"></script>

    </head>
    <body>
        <nav class="bg-light border navbar navbar-expand-md navbar-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="{{url_for('index')}}">Mail System</a>
                <button aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#navbar" data-bs-toggle="collapse" type="button">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbar">
                    <ul class="navbar-nav ms-auto mt-2">
                    {% if session["user_id"] %}
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('get_inbox') }}">Inbox</a></li>
                        <li class="nav-item"><a class="nav-link" href="/sent_box">Sent Box</a></li>
                        <li class="nav-item"><a class="nav-link" href="/profile">Profile</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                        <li class="nav-item"><a class="nav-link" href="/login">Log In</a></li>
                    {% endif %}
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container p-3 text-center" id="emailDetail">
            {% block profile %}
                {% if session['user_id'] %}
                    <div class="row d-flex justify-content-center overflow-auto">
                        <table class="table table-bordered table-hover text-start">
                            <thead>
                                <tr>
                                    <th class="col-2">Sender</th>
                                    <th class="col-2">Receiver</th>
                                    <th class="col-5">Subject</th>
                                    <th class="col-3">Time</th>
                                </tr>
                            </thead>
                            <tbody id="emailViewer"></tbody>
                        </table>
                    </div>
                {% endif %}
            {% endblock %}

            {% block body %} {% endblock %}
        </main>
    </body>
</html>
