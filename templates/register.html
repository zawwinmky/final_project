{% extends "layout.html" %}

{% block title %} Register {% endblock %}

{% block body %}
    
    <form id='regForm'>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="name" placeholder="Name" type="text">
        </div>

        <div class="mb-3">
            <input autocomplete="off" class="form-control mx-auto w-auto" name="email" placeholder="Email" type="email">
        </div>

        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="cpassword" placeholder="Confirm Password" type="password">
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
    </form>
    <script>
        const regForm = document.getElementById('regForm');
        regForm.addEventListener('submit', async function(event){
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);

            try{
                const response = await fetch('/register', {
                    method:'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok)
                {
                    throw new Error(data.message);
                }
                if (data.status === 'success'){
                    window.location.href = data.url;
                }
            } catch (error) {
                alert(error.message);
            }
        });
    </script>

{% endblock %}
