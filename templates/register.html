{% extends "layout.html" %}

{% block title %} Register {% endblock %}

{% block body %}
    <div class="col-4 text-center">
        <form id='regForm'>
            <div class="mb-3">
                <input autocomplete="new-password" autofocus class="form-control mx-auto w-auto" name="name" placeholder="Name" type="text" required>
            </div>
            
            <div class="mb-3">
                <input autocomplete="new-password" class="form-control mx-auto w-auto" name="email" placeholder="Email" type="email" required>
            </div>
            
            <div class="mb-3">
                <input autocomplete="new-password" class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password" required>
            </div>
            <div class="mb-3">
                <input autocomplete="new-password" class="form-control mx-auto w-auto" name="cpassword" placeholder="Confirm Password" type="password" required>
            </div>
            <button class="btn btn-primary" type="submit">Register</button>
        </form>
    </div>
    <script>
        const regForm = document.getElementById('regForm');
        regForm.addEventListener('submit', async function(event){
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);

            try{
                const response = await fetch('/register', {
                    method:'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok)
                {
                    throw new Error(data.message);
                }
                if (data.status === 'success'){
                    alert(data.message);
                    window.location.href = data.url;
                }
            } catch (error) {
                alert(error.message);
            }
        });
    </script>

{% endblock %}
