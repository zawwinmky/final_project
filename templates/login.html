{% extends "layout.html" %}

{% block title %} Login {% endblock %}

{% block body %}
    <div class="col-4 text-center">
        <form id="loginForm">
            <div class="mb-3">
                <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="email" placeholder="Email" type="email">
            </div>
            <div class="mb-3">
                <input class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password">
            </div>
            <button class="btn btn-primary" type="submit">Login</button>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        loginForm.addEventListener('submit', async function(event){
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);

            try {
                const response = await fetch('login', {
                    method : 'POST',
                    body : formData
                });

                const data = await response.json()

                if (!response.ok){
                    throw new Error(data.message);
                }

                if (data.status == 'success'){
                    window.location.href = data.redirect_url;
                }
            } catch (error) {
                alert(error.message);j
            }
        });
    </script>

{% endblock %}
